<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="darkPlate" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1c0505" />
      <stop offset="70%" stop-color="#0a0202" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Fire Outer Glow -->
    <radialGradient id="flameBackdrop" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#ff2200" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Text & Core Flame Gradient -->
    <linearGradient id="coreHeat" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#cc0000" />
      <stop offset="40%" stop-color="#ff3300" />
      <stop offset="75%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Edge Highlight Ring -->
    <linearGradient id="ringGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5500" />
      <stop offset="50%" stop-color="#330a0a" />
      <stop offset="100%" stop-color="#aa0000" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Icon Shape -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#darkPlate)" stroke="url(#ringGlow)" stroke-width="4.5" />

  <!-- Heat Ring / Backdrop -->
  <circle cx="256" cy="270" r="170" fill="url(#flameBackdrop)" />

  <!-- Stylized Flame Silhouette Behind Letters -->
  <path d="M256,90 
           C290,150 350,190 350,260 
           C350,320 310,360 256,360 
           C202,360 162,320 162,260 
           C162,190 222,150 256,90 Z" 
        fill="#ff3700" opacity="0.35" filter="url(#softGlow)" />

  <path d="M256,130 
           C280,180 320,210 320,265 
           C320,310 290,340 256,340 
           C222,340 192,310 192,265 
           C192,210 232,180 256,130 Z" 
        fill="#ff7700" opacity="0.5" />

  <!-- Bold Monogram -->
  <text x="50%" y="61%" text-anchor="middle" dominant-baseline="central"
        font-family="'Arial Black', 'Impact', sans-serif"
        font-weight="900" font-size="210" letter-spacing="-6"
        fill="url(#coreHeat)" stroke="#fff2a3" stroke-width="1.8" filter="url(#softGlow)">
    QM
  </text>

  <!-- Sharp Embers -->
  <polygon points="256,70 260,82 256,94 252,82" fill="#fffbcf" />
  <polygon points="175,180 178,190 175,200 172,190" fill="#ffcc00" opacity="0.8" />
  <polygon points="340,165 343,173 340,181 337,173" fill="#ff9900" opacity="0.85" />
  <circle cx="295" cy="115" r="3" fill="#ffffff" />
  <circle cx="215" cy="135" r="2.5" fill="#ffaa00" />
</svg>
