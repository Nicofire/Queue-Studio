<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a0808" />
      <stop offset="60%" stop-color="#140404" />
      <stop offset="100%" stop-color="#050101" />
    </radialGradient>

    <!-- Fire / Magma Gradient for QM -->
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7a0000" />
      <stop offset="35%" stop-color="#d61a00" />
      <stop offset="70%" stop-color="#ff6600" />
      <stop offset="100%" stop-color="#ffea00" />
    </linearGradient>

    <!-- Inner Glow / Core Filter -->
    <filter id="fireGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="1.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Outer Bloom Filter -->
    <filter id="outerBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22" result="blur" />
    </filter>
  </defs>

  <!-- Background App Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="100" ry="100" fill="url(#bgGrad)" stroke="#ff3300" stroke-opacity="0.3" stroke-width="4" />

  <!-- Outer Glow for Letters -->
  <text x="50%" y="58%" text-anchor="middle" dominant-baseline="central"
        font-family="'Segoe UI', 'Impact', 'Arial Black', sans-serif"
        font-weight="900" font-size="220" letter-spacing="4"
        fill="#ff2200" filter="url(#outerBloom)" opacity="0.8">
    QM
  </text>

  <!-- Main "QM" Letters with Fire Gradient -->
  <text x="50%" y="58%" text-anchor="middle" dominant-baseline="central"
        font-family="'Segoe UI', 'Impact', 'Arial Black', sans-serif"
        font-weight="900" font-size="220" letter-spacing="4"
        fill="url(#fireGrad)" stroke="#ffe680" stroke-width="2" filter="url(#fireGlow)">
    QM
  </text>

  <!-- Embers / Sparks Accents -->
  <circle cx="160" cy="180" r="4" fill="#ffdd55" opacity="0.8" />
  <circle cx="340" cy="160" r="5" fill="#ff7700" opacity="0.7" />
  <circle cx="280" cy="130" r="3.5" fill="#ffea00" opacity="0.9" />
  <circle cx="210" cy="350" r="3" fill="#ff4400" opacity="0.6" />
  <circle cx="370" cy="310" r="4" fill="#ff9900" opacity="0.75" />
</svg>
